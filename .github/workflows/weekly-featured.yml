name: Weekly featured drives

# Every Sunday, pin Saturday's biggest late drives as the daily drive Sunday through Saturday (build/weekly_featured.py).
#
# SportsDataverse refreshes the play-by-play once on Sunday (it lands about 12:00-13:50 UTC) and once on Monday
# (13:00-16:30 UTC), and now and then the Sunday refresh fails (Oct 25, 2026). So: four tries on Sunday, 12:37-18:37 UTC
# (6:37am-12:37pm MDT, 5:37-11:37am MST); the first that finds the whole Saturday slate pins the week and the rest exit 2.
# If Sunday never got there, two Monday tries pin Monday through Saturday. August through January only.
#
# The job never runs a plain build.py, never force-pushes, and pushes only a single commit that changes nothing in
# docs/data.json except additions (checked twice: by the script before it commits, and here before the push).
# A failed run, or a week the feed never caught up by Monday's last try, opens an issue labeled weekly-featured that
# @mentions the owner; the next run that pins a week closes it. GitHub also emails failed scheduled runs.
#
# By hand: Actions -> Weekly featured drives -> Run workflow. dry-run ranks only; rehearsal builds, checks and commits
# on the runner without pushing; run is the real thing (from main only).

on:
  schedule:
    - cron: '37 12 * 1,8-12 0'
    - cron: '37 14 * 1,8-12 0'
    - cron: '37 16 * 1,8-12 0'
    - cron: '37 18 * 1,8-12 0'
    - cron: '37 15 * 1,8-12 1'
    - cron: '37 17 * 1,8-12 1'   # the last try of the week (FINAL below)
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: fetch and rank only. rehearsal: build, check and commit on the runner, no push. run: pin and push (main only).'
        type: choice
        options: [dry-run, rehearsal, run]
        default: dry-run
      args:
        description: 'More weekly_featured.py arguments, e.g. --saturday 2026-10-24 --start 2026-10-26 --days 6'
        required: false
        default: ''
  pull_request:
    paths: ['.github/workflows/weekly-featured.yml', 'build/**']

permissions:
  contents: write   # push the commit to main
  issues: write     # open and close the failure issue
  pages: write      # ask for a Pages build after the push

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('weekly-featured-pr-{0}', github.ref) || 'weekly-featured' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FINAL: '37 17 * 1,8-12 1'

jobs:
  featured:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CFB_RAW: ${{ github.workspace }}/raw/
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Decide what this run does
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_ARGS: ${{ inputs.args }}
        run: |
          final=false args=
          case "$EVENT" in
            schedule)
              mode=run
              if [ "$(date -u +%u)" = 1 ]; then args="--start $(date -u +%F) --days 6"; fi   # Monday: pin Monday-Saturday
              [ "$SCHEDULE" = "$FINAL" ] && final=true ;;
            workflow_dispatch) mode=$IN_MODE args=$IN_ARGS ;;
            *) mode=dry-run ;;
          esac
          if [ "$mode" = run ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::mode run pushes to main, so it only runs from main"; exit 1
          fi
          echo "mode=$mode final=$final args=$args"
          { echo "mode=$mode"; echo "final=$final"; echo "args=$args"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: build/requirements.txt
      - run: pip install -r build/requirements.txt

      # the 2023-2025 seasons (about 380 MB), pinned by hash in fetch_inputs.py; weekly_featured.py fetches the current one
      - name: Restore the fixed inputs
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: raw
          key: raw-inputs-${{ hashFiles('build/fetch_inputs.py') }}
      - name: Download any that are missing
        id: inputs
        working-directory: build
        run: python fetch_inputs.py
      - name: Keep them for next week
        if: steps.cache.outputs.cache-hit != 'true' && steps.inputs.outputs.pinned == 'true'
        uses: actions/cache/save@v6
        with:
          path: raw
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Run weekly_featured.py
        id: run
        working-directory: build
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          ARGS: ${{ steps.plan.outputs.args }}
          IS_FINAL: ${{ steps.plan.outputs.final }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/start"
          if [ "$MODE" = dry-run ]; then flag=--dry-run; else flag=--commit-only; fi
          set +e +o pipefail
          python weekly_featured.py $flag $ARGS 2>&1 | tee "$RUNNER_TEMP/run.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          { echo "### weekly_featured.py $flag $ARGS: exit $code"; echo '```'; tail -n 60 "$RUNNER_TEMP/run.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case $code in
            0) exit 0 ;;
            2) echo "::notice::Already pinned for this week: nothing to do." ;;
            4) echo "::notice::No games last Saturday, or no drive qualified: nothing to pin this week." ;;
            3) if [ "$IS_FINAL" = true ]; then
                 echo "::error::The feed never got all of Saturday's games: nothing pinned this week."; exit 1
               fi
               echo "::notice::The feed doesn't have all of Saturday's games yet; a later scheduled run tries again." ;;
            *) echo "::error::weekly_featured.py failed (exit $code)"; exit 1 ;;
          esac

      - name: Check the commit only adds to data.json
        id: check
        if: steps.run.outputs.code == '0' && steps.plan.outputs.mode != 'dry-run'
        run: |
          start=$(cat "$RUNNER_TEMP/start")
          [ "$(git rev-parse HEAD^)" = "$start" ] || { echo "::error::expected exactly one new commit"; exit 1; }
          changed=$(git diff --name-only "$start" HEAD)
          [ "$changed" = docs/data.json ] || { echo "::error::the commit changes more than docs/data.json: $changed"; exit 1; }
          git show "$start:docs/data.json" > "$RUNNER_TEMP/old.json"
          python build/check_additions.py "$RUNNER_TEMP/old.json" docs/data.json
          git log -1 --format='%an <%ae>%n%n%B'

      - name: Keep what was built
        if: always() && steps.run.outputs.code != '' && steps.plan.outputs.mode != 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: featured-${{ github.run_id }}
          path: |
            build/featured.json
            ${{ runner.temp }}/run.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Push to main
        id: push
        if: steps.run.outputs.code == '0' && steps.plan.outputs.mode == 'run'
        run: git push origin HEAD:refs/heads/main   # a plain push: if main moved meanwhile it is refused, never forced

      - name: Wait for the site to serve the new drives
        id: live
        if: steps.run.outputs.code == '0' && steps.plan.outputs.mode == 'run'
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent ||
            echo "::warning::Could not ask for a Pages build; waiting for the one the push starts"
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          for i in $(seq 40); do
            sleep 30
            if curl -fsSL "${site}data.json?v=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/live.json" &&
               python -c 'import json, sys; a, b = (json.load(open(f, encoding="utf-8"))["featured"] for f in sys.argv[1:]); sys.exit(a != b)' \
                 docs/data.json "$RUNNER_TEMP/live.json"; then
              echo "${site} serves the new drives"; exit 0
            fi
          done
          echo "::error::${site} still serves the old data.json 20 minutes after the push"; exit 1

      - name: Close the failure issue
        if: success() && steps.push.outcome == 'success' && github.event_name == 'schedule'
        run: |
          for n in $(gh issue list -l weekly-featured -s open --json number -q '.[].number'); do
            gh issue close "$n" -c "This week is pinned: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        env:
          CODE: ${{ steps.run.outputs.code }}
          CHECK: ${{ steps.check.outcome }}
          PUSH: ${{ steps.push.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          if [ "$LIVE" = failure ]; then what="The drives are pushed to main, but the site still served the old data.json 20 minutes later. Check the latest pages-build-deployment run and Settings -> Pages."
          elif [ "$PUSH" = failure ]; then what="The push to main was refused (main probably moved during the build). Nothing was pushed; the next scheduled run starts over from the new main."
          elif [ "$CHECK" = failure ]; then what="The commit changed more than additions to docs/data.json, so it was not pushed."
          elif [ "$CODE" = 3 ]; then what="The play-by-play feed never got all of Saturday's games (last try was Monday), so nothing was pinned: this week's dailies stay on the normal rotation."
          elif [ -z "$CODE" ]; then what="The job failed before weekly_featured.py ran (setup, or downloading the inputs)."
          else what="weekly_featured.py failed with exit $CODE. Nothing was pushed."; fi
          gh label create weekly-featured --color B60205 --description "The Sunday featured-drive job needs a look" 2>/dev/null || true
          body=$(printf '@%s %s\n\nRun: %s\n\nEnd of the log:\n```\n%s\n```\n\nTo retry by hand: Actions -> Weekly featured drives -> Run workflow, mode `run` (on a Monday, add `--start YYYY-MM-DD --days 6` to pin Monday-Saturday). The next scheduled run that pins a week closes this issue.' \
            "$GITHUB_REPOSITORY_OWNER" "$what" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(tail -n 40 "$RUNNER_TEMP/run.log" 2>/dev/null)")
          n=$(gh issue list -l weekly-featured -s open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -b "$body"
          else gh issue create -t "Weekly featured drives: the $(date -u +%a\ %b\ %d) run needs a look" -l weekly-featured -b "$body"; fi
